<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2027" />
      <stop offset="100%" stop-color="#0f1316" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with border -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#f97316" stroke-width="8" stroke-opacity="0.4" />

  <!-- Inner ambient glow -->
  <circle cx="256" cy="240" r="160" fill="url(#glowGrad)" opacity="0.18" />

  <!-- Stylized Fantasy Quill & Dragon Flame Monogram "IW" -->
  <g filter="url(#glow)">
    <!-- Dragon Flame / Quill Nib Outer Silhouette -->
    <path d="M 256 72 C 274 140, 340 180, 348 248 C 356 316, 308 360, 256 396 C 204 360, 156 316, 164 248 C 172 180, 238 140, 256 72 Z" fill="url(#primaryGrad)" />
    
    <!-- Central Ink Channel (Negative Space Slash) -->
    <path d="M 256 120 L 256 320 L 252 350 L 256 380 L 260 350 L 256 320 Z" fill="#12161a" opacity="0.9" />

    <!-- Sharp Quill Diamond Accent -->
    <polygon points="256,150 274,220 256,290 238,220" fill="#ffffff" opacity="0.2" />

    <!-- "INK" Monogram Cross Wing Left -->
    <path d="M 172 260 C 130 280, 108 320, 116 364 C 152 360, 186 332, 204 296 Z" fill="url(#primaryGrad)" opacity="0.85" />

    <!-- "WINK" Wing Right -->
    <path d="M 340 260 C 382 280, 404 320, 396 364 C 360 360, 326 332, 308 296 Z" fill="url(#primaryGrad)" opacity="0.85" />
    
    <!-- Sparks / Magic Runes -->
    <circle cx="256" cy="428" r="8" fill="#fb923c" />
    <circle cx="200" cy="180" r="4" fill="#fdba74" opacity="0.8" />
    <circle cx="312" cy="180" r="4" fill="#fdba74" opacity="0.8" />
  </g>
</svg>
